<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade14</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Transformador de Texto</h1>

    <label for="inputTexto">Digite um texto:</label>
    <input type="text" id="inputTexto" placeholder="Digite aqui...">

    <div class="opcoes">
      <label>
        <input type="radio" name="transformacao" value="maiusculo">
        MAIÚSCULAS
      </label>
      <label>
        <input type="radio" name="transformacao" value="minusculo">
        minúsculas
      </label>
    </div>

    <p id="resultado"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
