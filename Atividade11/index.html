<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formas de criar objetos</title>
  </head>
  <body>
    <script>
      var aluno1 = new Object();
      // usando Object
      aluno1.ra = "00001234";
      aluno1.nome = "Guilherme";
      alert(`ra=${aluno1.ra} nome=${aluno1.nome}`);

      var aluno2 = {}; //usando {}
      aluno2.ra = "1234";
      aluno2["nome"] = "Gabriela";
      alert("ra" + aluno2.ra + " nome=" + aluno2.nome);
      aluno2["email do aluno"] = "gabriela@gmail.com";
      alert(aluno2["email do aluno"]);

      var aluno3 = {
        //literal
        ra: "1234567",
        nome: "Marcos", //vírgula opcional
      };
      alert("ra=" + aluno3.ra + " nome=" + aluno3.nome);

      //usando função construtora - this significa público
      function Aluno(ra, nome) {
        this.ra = ra;
        this.nome = nome;
        this.MostraDados = function () {
          return "ra=" + this.ra + " nome=" + this.nome;
        };
      }
      var aluno4 = new Aluno("123", "Vitor");
      alert(aluno4.MostraDados());
      alert(aluno4.nome);

      //Função construtora sem parâmetros
      function Aluno2() {
        var ra; //"encapsulado escondido"
        var nome;
        this.setRa = function (value) {
          this.ra = value;
        };
        this.getRa = function () {
          return this.ra;
        };
        this.setNome = function (value) {
          this.nome = value;
        };
        this.getNome = function () {
          return this.nome;
        };
      }
      var aluno6 = new Aluno2();
      aluno6.setNome("Nickolas");
      aluno6.setRa("234");
      alert("ra=" + aluno6.getRa() + " nome=" + aluno6.getNome());

      //herança
      function AlunoADS() {
        var numLab;
        this.setNumLab = function (value) {
          this.numLab = value;
        };
        this.getNumLab = function () {
          return this.numLab;
        };
      }
      //herança
      AlunoADS.prototype = new Aluno2();
      var aluno7 = new AlunoADS();
      aluno7.setNome("Evandro");
      aluno7.setRa("123");
      aluno7.setNumLab(5);
      alert(aluno7.getNome() + " " + aluno7.getNumLab() + aluno7.getRa());

      //Usando Class
      class Aluno1 {
        constructor() {
          this._ra;
          this._nome;
        }
        setNome(value) {
          this._nome = value;
        }
        getNome() {
          return this._nome;
        }
        setRa(value) {
          this._ra = value;
        }
        getRa() {
          return this._ra;
        }
      }
      var objAluno = new Aluno1();
      objAluno.setNome("Eduardo");
      objAluno.setRa("123");
      alert(`nome=${objAluno.getNome()}
      ra=${objAluno.getRa()} `);

      //herança
      class AlunoADS1 extends Aluno1 {
        constructor() {
          //super chama o construtor da classe pai
          super();
          this._numLab;
        }
        setNumLab(value) {
          this._numLab = value;
        }
        setNumLab(value) {
          this._numLab = value;
        }
        getNumLab() {
          return this._numLab;
        }
      }
      var objAlunoADS = new AlunoADS1();
      objAlunoADS.setNome("Caio");
      objAlunoADS.setRa("123");
      objAlunoADS.setNumLab(6);
      alert(`nome=${objAlunoADS.getNome()}
      ra=${objAlunoADS.getRa()}
      numLab=${objAlunoADS.getNumLab()}`);

      //outros

      //cópia de objetos
      var obj1 = new Object();
      var obj2 = obj1;
      obj1.nome = "Matheus";
      alert(obj2.nome);

      //metodos e atributos - publicos e privados
      class ContaBancaria {
        #cpf; //atributo privado

        constructor(nome, saldoInicial) {
          this.nome = nome; //atributo publico
          this.saldo = saldoInicial;
        }
        setCpf(value) {
          this.cpf = value;
        }
        getCpf() {
          return this.cpf;
        }
        getSaldo() {
          return this.saldo;
        }
        //metodo publico
        depositar(valor) {
          this.saldo += valor;
          this.#registrarTransacao(valor);
          //utilizando o modificador #
          //para metodo privado
        }

        //metodo privado
        #registrarTransacao(valor) {
          console.log(`Depósito de R$ ${valor}
          Sando R$ ${this.saldo} para cpf
          ${this.getCpf()} ou ${this.#cpf}`);
        }
      }
      const conta = new ContaBancaria("Gustavo", 1000);
      conta.setCpf(123);
      conta.depositar(50);
      //ver no console se aparece

      const arr = [
        ["codigo", 1],
        ["nome", "João"],
        ["idade", 23],
      ];
      const obj = Object.fromEntries(arr);
      alert(obj); //imprime object
      alert(obj.nome); //imprime o nome
      alert(JSON.stringify(obj));
      //converte em JSON

      //Object.Create() cria um novo objeto,
      // utilizando um outro objeto existente
      // (prototipo

      // Alteração no prototipo reflete no novo
      const objEmpresa = {
        empresa: "ZF do Brasil",
      };
      const funcionario = Object.create(objEmpresa, {
        nome: {
          value: "Jorge",
        },
        endereco: {
          value: "Av. São Paulo",
        },
      });
      console.log(funcionario.empresa); // ZF do Brasil
      console.log(funcionario.nome); // Jorge
      console.log(funcionario.endereco); //Av. São Paulo

      //O método Object.assign() é usado
      // para copiar os
      // valores de todas as pripriedades
      // de um ou mais
      // Objetos origem para um objeto de destino.

      const objNovaEmpresa = {
        empresa: "ZF do Brasil",
      };
      const objVeiculo = {
        placa: "XXX 1234",
      };
      const motorista = Object.assign(
        {
          cpf: "123",
        },
        objNovaEmpresa,
        objVeiculo,
      );
      console.log(motorista); //empresa: ZF do Brasil, placa XXX 1234, etc
    </script>
  </body>
</html>
