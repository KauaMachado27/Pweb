<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Atividade 9</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Atividade 9</h1>

<div class="box">
    <h3>1) Maior número</h3>
    <input id="n1"><input id="n2"><input id="n3">
    <button onclick="calcMaior()">Calcular</button>
</div>

<div class="box">
    <h3>2) Ordem crescente</h3>
    <input id="c1"><input id="c2"><input id="c3">
    <button onclick="calcCrescente()">Ordenar</button>
</div>

<div class="box">
    <h3>3) Palíndromo</h3>
    <input id="texto">
    <button onclick="calcPalindromo()">Verificar</button>
</div>

<div class="box">
    <h3>4) Subconjunto</h3>
    <input id="p1" placeholder="Palavra 1">
    <input id="p2" placeholder="Palavra 2">
    <button onclick="calcSub()">Verificar</button>
</div>

<div class="box">
    <h3>5) Dia da semana</h3>
    <input type="date" id="data">
    <button onclick="calcData()">Ver</button>
</div>

<h2 id="resultado"></h2>

<script src="script.js"></script>
</body>
</html>
